  <script>
    // Danh sách các bài hát
    var tracks = [
      'audio/snmedm.mp3',
      'audio/1.mp3',
      'audio/2.mp3'
    ];
  
    var currentTrack = 0;
    var audio = new Audio(tracks[currentTrack]);
  
    audio.loop = false; // Tắt loop từng bài, để tự chuyển bài
  
    audio.oncanplaythrough = function () {
      audio.play();
    }
  
    // Khi bài hát kết thúc, chuyển sang bài tiếp theo
    audio.onended = function () {
      currentTrack++;
      if (currentTrack >= tracks.length) {
        currentTrack = 0; // Quay lại bài đầu nếu hết danh sách
      }
      audio.src = tracks[currentTrack];
      audio.load(); // Nạp bài mới
    }
  
    // Bắt đầu phát
    audio.load();
  </script>
